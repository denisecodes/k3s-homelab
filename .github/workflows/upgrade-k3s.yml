name: K3s upgrade

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      k3s_version:
        description: 'K3s version to upgrade to (e.g. v1.33.10+k3s1)'
        required: true

permissions:
  issues: write
  contents: write

jobs:
  handle-reject:
    if: >
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '/reject') &&
      contains(github.event.issue.labels.*.name, 'k3s-upgrade')
    runs-on: ubuntu-latest
    steps:
      - name: React 👎
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1'
            });

      - name: Close issue
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ Upgrade rejected. Closing issue.'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });

  upgrade:
    if: >
      (github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '/upgrade') &&
      contains(github.event.issue.labels.*.name, 'k3s-upgrade')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: React 👍
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set git remote with token
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Determine version
        id: version
        uses: actions/github-script@v9
        with:
          script: |
            let version;
            if (context.eventName === 'workflow_dispatch') {
              version = '${{ github.event.inputs.k3s_version }}';
            } else {
              const title = context.payload.issue.title;
              const match = title.match(/→\s*(v[\d.]+\+k3s\d+)/);
              if (!match) core.setFailed('Version not found');
              version = match[1];
            }
            core.setOutput('k3s_version', version);

      - name: Comment start
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Upgrade started\n\n${runUrl}`
            });

      # --- your existing infra steps unchanged ---
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-routes

      - name: Install Ansible
        run: pip install ansible

      - name: Run upgrade playbook
        run: |
          ansible-playbook k3s-ansible/playbooks/upgrade.yml

      # --- FIXED PUSH ---
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k3s/k3s-config.yml
          git commit -m "chore: upgrade K3s to ${{ steps.version.outputs.k3s_version }}" || echo "No changes"
          git push

      - name: Close issue
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Upgrade completed'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });