---
# Installs multimedia tooling focused on CD ripping on Ubuntu nodes.
# Includes CLI tools/codecs for CD and DVD ripping/transcoding.
#
# Before running:
#   cp linux/inventory/hosts.ini linux/inventory/hosts-local.ini
#   # edit hosts-local.ini with your real IPs, username, and timezone
#
# Run with:
#   ansible-playbook -i linux/inventory/hosts-local.ini linux/playbooks/multimedia-setup.yml \
#     --ask-become-pass

- name: Multimedia and CD ripping setup
  hosts: homelab
  become: true

  vars:
    multimedia_packages:
      - abcde
      - cdparanoia
      - cdrdao
      - dvdbackup
      - eject
      - ffmpeg
      - flac
      - handbrake-cli
      - id3v2
      - lame
      - vorbis-tools
      - udisks2

  tasks:
    - name: Enable Universe repository
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts['distribution_release'] }} universe"
        state: present
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Install MakeMKV via snap
      community.general.snap:
        name: makemkv
        state: present
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Install multimedia packages
      ansible.builtin.apt:
        name: "{{ multimedia_packages }}"
        state: present
        update_cache: true
      register: apt_result
      until: apt_result is succeeded
      retries: 3
      delay: 10

    - name: Ensure udisks2 is enabled and running
      ansible.builtin.service:
        name: udisks2
        enabled: true
        state: started

    # DVD playback/decryption support:
    - name: Pre-seed libdvd-pkg debconf to auto-confirm build
      ansible.builtin.debconf:
        name: libdvd-pkg
        question: libdvd-pkg/build
        value: "true"
        vtype: boolean

    - name: Install libdvd-pkg
      ansible.builtin.apt:
        name: libdvd-pkg
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Build and install libdvdcss via libdvd-pkg
      ansible.builtin.command: dpkg-reconfigure libdvd-pkg
      changed_when: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    # CD playback/decryption support:        
    - name: Add Ansible user to cdrom group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: cdrom
        append: true
      when: ansible_user is defined

    - name: Add Ansible user to audio group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: audio
        append: true
      when: ansible_user is defined

    - name: Show post-install notes
      ansible.builtin.debug:
        msg:
          - "Multimedia packages installed. Rip CDs with: abcde -o flac -x"
          - "Rip DVDs with: dvdbackup -M -i /dev/sr0 -o ~/dvd-rips/"
          - "Transcode DVDs with: HandBrakeCLI -i ~/dvd-rips/<DISC_TITLE>/VIDEO_TS -o ~/dvd-rips/'Movie Name (Year).mkv' --encoder x265 --preset='Fast 1080p30'"
          - "If group changes were applied, log out and back in before ripping."